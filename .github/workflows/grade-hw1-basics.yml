name: Grade hw1-basics

on:
  push:
    paths:
      - "hw1-basics/**"
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r hw1-basics/requirements.txt

      - name: Fetch hidden tests
        env:
          TESTS_TOKEN: ${{ secrets.TESTS_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TESTS_TOKEN}@github.com/gruzdev-as/hw1-tests.git" \
            hidden_tests

      - name: Run tests
        run: |
          cd hw1-basics
          pytest --tb=no -q -m "not bonus" --junitxml=results.xml public_tests ../hidden_tests

      - name: Report score
        if: always()
        run: python3 .github/scripts/report_score.py hw1-basics/results.xml --title "hw1-basics"

      - name: Run bonus task (Vigenère cipher)
        if: always()
        continue-on-error: true
        run: |
          cd hw1-basics
          pytest --tb=no -q -m bonus --junitxml=results-bonus.xml public_tests ../hidden_tests

      - name: Report bonus score
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/report_score.py hw1-basics/results-bonus.xml --title "Бонус (шифр Виженера)"

      - name: Remove hidden tests
        if: always()
        run: rm -rf hidden_tests hw1-basics/results.xml hw1-basics/results-bonus.xml
