name: Grade hw3-oop

on:
  push:
    paths:
      - "hw3-oop/**"
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r hw3-oop/requirements.txt

      - name: Fetch hidden tests
        env:
          TESTS_TOKEN: ${{ secrets.TESTS_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TESTS_TOKEN}@github.com/gruzdev-as/hw3-tests.git" \
            hidden_tests

      # -rN: не печатать сводку с именами упавших тестов - имена скрытых тестов описывают
      # ловушки. --tb=no: не печатать ожидаемые значения. Балл считает report_score.py.
      - name: Run tests
        run: |
          cd hw3-oop
          pytest --tb=no -q -rN --continue-on-collection-errors -m "not bonus" --junitxml=results.xml public_tests ../hidden_tests

      - name: Report score
        if: always()
        run: python3 .github/scripts/report_score.py hw3-oop/results.xml --tasks task1,task2,task3,task4 --title "hw3-oop" --json scores/score.json

      - name: Run bonus task (magic methods + composition)
        if: always()
        continue-on-error: true
        run: |
          cd hw3-oop
          pytest --tb=no -q -rN --continue-on-collection-errors -m bonus --junitxml=results-bonus.xml public_tests ../hidden_tests

      - name: Report bonus score
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/report_score.py hw3-oop/results-bonus.xml --tasks task_bonus --title "Бонус (магические методы + композиция)" --json scores/score-bonus.json

      # Только итоговые числа (score.json), без тестов и их вывода - для автоматического сбора оценок.
      - name: Upload score
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: score-hw3-oop
          path: scores/
          retention-days: 90

      - name: Remove hidden tests
        if: always()
        run: rm -rf hidden_tests hw3-oop/results.xml hw3-oop/results-bonus.xml
